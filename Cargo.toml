[package]
name = "synka"
version = "0.2.0"
edition = "2021"
description = "Synka: syncs ACC Docs files to a local folder on Windows (Cloud Files API)"
publish = false

[[bin]]
name = "synka-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2", "json", "stream"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = "0.2"
base64 = "0.22"
sha2 = "0.11"
getrandom = "0.4"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26"
semver = "1"
# Same versions the windows crate uses. `#[implement]` expands to `::windows_core` paths, and
# windows 0.62 does not re-export `windows_collections` (IIterable<T>).
windows-core = "0.62.2"
windows-collections = "0.3.2"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_System_Com_Urlmon",
  "ApplicationModel_DataTransfer",
  "Win32_Graphics_Gdi",
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_CorrelationVector",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Recovery",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Storage",
  "Storage_Provider",
  "Storage_Search",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel",
  "Management_Deployment",
  "Security_Cryptography",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
