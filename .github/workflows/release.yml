# Release: Actions -> Release -> Run workflow (bump: patch/minor/major,
# notes: what is new, in Swedish). This path requires the signing-key secrets.
# A manually pushed tag does not start this workflow; see packaging/README.md
# for the first release using the locally signed package.
#
#   bump     (dispatch only, ubuntu)  refuses unless the commit's CI is green, then
#            version.ps1 bumps Cargo.toml + Cargo.lock, commit "chore: version
#            X.Y.Z", annotated tag vX.Y.Z, both pushed in one atomic push
#   build    (windows)  checks out the tag; tag == Cargo.toml version; cargo test;
#            cargo build --release; build_msix.ps1 signs with SIGNING_PFX_BASE64;
#            the signature is verified; make_delivery.ps1 packs the sideload zip
#   publish  (ubuntu)  GitHub release on this (public) repository with the zip, the
#            signed msix and FastADC.cer. The OneDrive copy for Byggstyrning's staff is
#            a separate step (packaging/share_release.ps1).

# A tag pushed with GITHUB_TOKEN starts no workflow: build and publish run here,
# as jobs of the dispatch run.
#
# Secrets: SIGNING_PFX_BASE64, SIGNING_PFX_PASSWORD (required).
# See packaging/README.md, "Release from GitHub Actions".
#
# A run that failed after the bump: fix the cause, then "Re-run failed jobs"
# (publishing is idempotent). "Re-run all jobs" stops at the bump: the tag exists.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: 'Nyheter, på svenska (Markdown). Tomt: commits sedan förra versionen.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One release at a time; a second one waits instead of racing for the tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_XMLDOC_MODE: skip
  DOTNET_SDK: '8.0.x'

jobs:
  bump:
    name: Bump, tag and push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Includes waiting for the commit's CI run to finish.
    timeout-minutes: 90
    permissions:
      contents: write   # push the version commit and the tag
      actions: read     # read the CI runs of the commit
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Release from the default branch only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error title=Wrong branch::A release is cut from $DEFAULT_BRANCH, not $GITHUB_REF. Pick $DEFAULT_BRANCH under 'Use workflow from'."
            exit 1
          fi

      # Before anything is tagged: a tag whose build cannot be signed would
      # spend a version number for nothing.
      - name: Check the signing secrets
        env:
          HAS_PFX: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_PFX" = true ] || missing="$missing SIGNING_PFX_BASE64"
          [ "$HAS_PASSWORD" = true ] || missing="$missing SIGNING_PFX_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Repository secret(s)$missing not set (Settings -> Secrets and variables -> Actions). See packaging/README.md. Nothing was bumped or tagged."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # History and tags: the "already released" check below, and the push.
          fetch-depth: 0

      - name: Refuse a commit that is already released
        run: |
          released="$(git tag --points-at HEAD --list 'v[0-9]*')"
          if [ -n "$released" ]; then
            echo "::error title=Nothing to release::${GITHUB_SHA:0:7} is already tagged $released. Push new commits first, or, if that release failed, re-run its failed jobs."
            exit 1
          fi

      # The tests run in CI on every push. A release of a commit whose CI failed
      # would tag a version that never builds; one still running is waited for.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20"
          short="${GITHUB_SHA:0:7}"
          deadline=$((SECONDS + 180))
          while :; do
            runs="$(gh api "$api")"
            if [ "$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              echo "CI passed on $short."
              break
            fi
            running="$(jq -r '[.workflow_runs[] | select(.status != "completed")][0].html_url // empty' <<<"$runs")"
            if [ -n "$running" ]; then
              echo "CI is still running on $short ($running); waiting."
              sleep 30
              continue
            fi
            if [ "$(jq '.workflow_runs | length' <<<"$runs")" -gt 0 ]; then
              url="$(jq -r '.workflow_runs[0].html_url' <<<"$runs")"
              echo "::error title=CI failed::CI did not pass on $short ($url). Fix it, or re-run it, then release. Nothing was bumped or tagged."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=No CI run::CI (ci.yml) has not run on $short. Nothing was bumped or tagged."
              exit 1
            fi
            echo "No CI run for $short yet; waiting."
            sleep 15
          done

      # cargo refreshes Cargo.lock (version.ps1 runs cargo update --workspace).
      - uses: dtolnay/rust-toolchain@stable

      - name: Bump the version (packaging/version.ps1)
        id: bump
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $next = & ./packaging/version.ps1 -Bump $env:BUMP
          if ($next -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "version.ps1 returned '$next'" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$next"
          git diff --stat
          # Only the two version files may change.
          $other = @(git status --porcelain | Where-Object { $_ -notmatch '^ M (Cargo\.toml|Cargo\.lock)$' })
          if ($other.Count -gt 0) { throw "The bump changed more than Cargo.toml and Cargo.lock: $($other -join '; ')" }

      - name: Commit, tag and push
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error title=Tag exists::The tag $tag already exists. Nothing was pushed."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::A release $tag already exists. Nothing was pushed."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.toml Cargo.lock
          git commit -m "chore: version $VERSION"

          # Annotated. The message body carries the notes; the publish job puts
          # them on the release page. Verbatim, so Markdown headings (#) survive.
          message="$RUNNER_TEMP/tag-message.txt"
          printf 'Synka %s\n' "$VERSION" > "$message"
          if [ -n "${NOTES//[[:space:]]/}" ]; then
            printf '\n%s\n' "$NOTES" >> "$message"
          fi
          git tag -a "$tag" -F "$message" --cleanup=verbatim

          # Atomic: the commit and the tag land together or not at all. A main
          # that moved since the run started refuses the push, and nothing is lost.
          git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tagged and pushed $tag ($(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and sign (Windows)
    needs: bump
    if: ${{ !cancelled() && needs.bump.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.bump.outputs.tag }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag name
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "'$env:TAG' is not a release tag (vX.Y.Z)." }

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag against Cargo.toml
        id: version
        run: |
          $version = & ./packaging/version.ps1
          if ("v$version" -ne $env:TAG) {
            throw "The tag is $env:TAG, but Cargo.toml at that commit says $version. The tag is made from Cargo.toml, never the other way round."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$env:TAG"
          Write-Host "Releasing Synka $version from $env:TAG"

      - uses: dtolnay/rust-toolchain@stable

      # Restores CI's cache from main; a release never saves one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine
          save-if: false

      - name: cargo test
        run: cargo test --locked -- --test-threads=1

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Set up .NET
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Pin the .NET SDK
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:SDK_VERSION } } | ConvertTo-Json | Set-Content -Path global.json -Encoding utf8NoBOM
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet does not start with the pinned SDK $env:SDK_VERSION" }

      - name: Restore NuGet packages from CI's cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ui/Synka.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The engine signature is verified before it is packed into the MSIX.
      # Trust the same committed certificate previously imported by the final
      # verification step, on this disposable runner only.
      - name: Trust the committed release certificate
        run: |
          $cerFile = (Resolve-Path packaging/FastADC.cer).Path
          $cer = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cerFile)
          $store = [Security.Cryptography.X509Certificates.X509Store]::new(
            [Security.Cryptography.X509Certificates.StoreName]::Root,
            [Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine)
          $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          try { $store.Add($cer) } finally { $store.Close() }

      # build_msix.ps1 checks the key before it builds: CN=FastADC, private key
      # present, and the same certificate as packaging/FastADC.cer (the one
      # recipients trust). The .pfx lives in RUNNER_TEMP for this step only.
      - name: Build and sign the MSIX, pack the sideload zip
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { $missing += "SIGNING_PFX_BASE64" }
          if ([string]::IsNullOrEmpty($env:SIGNING_PFX_PASSWORD)) { $missing += "SIGNING_PFX_PASSWORD" }
          if ($missing.Count -gt 0) {
            Write-Output "::error title=Signing secrets missing::Repository secret(s) $($missing -join ', ') not set (Settings -> Secrets and variables -> Actions). See packaging/README.md."
            exit 1
          }

          $pfx = Join-Path $env:RUNNER_TEMP "synka-signing.pfx"
          try {
            try { $bytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64) }
            catch { throw "SIGNING_PFX_BASE64 is not valid base64. Make it with [Convert]::ToBase64String([IO.File]::ReadAllBytes('FastADC.pfx'))." }
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force

            & ./packaging/build_msix.ps1 -SkipTests -SkipEngineBuild -PfxPath $pfx -PfxPassword $password
            if ($LASTEXITCODE -ne 0) { throw "build_msix.ps1 failed (exit code $LASTEXITCODE)" }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

          & ./packaging/make_delivery.ps1 -SkipBuild -OutputDir dist
          if ($LASTEXITCODE -ne 0) { throw "make_delivery.ps1 failed (exit code $LASTEXITCODE)" }

      # build_msix.ps1 and make_delivery.ps1 already compare the signer with
      # FastADC.cer. This verifies the signature end to end, the way Windows does
      # on a recipient's machine once the certificate is trusted. This runner's
      # certificate trust was established before signing and packaging.
      - name: Verify the signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $msix = Get-ChildItem ui/AppPackages -Recurse -Filter "Synka_$($env:VERSION).0_x64.msix" | Select-Object -First 1
          if (-not $msix) { throw "No Synka_$($env:VERSION).0_x64.msix under ui/AppPackages" }
          $cerFile = (Resolve-Path packaging/FastADC.cer).Path
          $cer = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cerFile)

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Parent.Name -match '^[0-9]+(\.[0-9]+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in any Windows SDK under Windows Kits\10\bin" }
          Write-Host "signtool: $($signtool.FullName)"

          & $signtool.FullName verify /pa /v $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($msix.Name)" }

          $signature = Get-AuthenticodeSignature $msix.FullName
          if ($signature.Status -ne "Valid") { throw "Signature status of $($msix.Name): $($signature.Status) ($($signature.StatusMessage))" }
          if ($signature.SignerCertificate.Thumbprint -ne $cer.Thumbprint) {
            throw "$($msix.Name) is signed by $($signature.SignerCertificate.Thumbprint), FastADC.cer is $($cer.Thumbprint)"
          }
          if ($signature.SignerCertificate.Subject -ne "CN=FastADC") { throw "Signed by '$($signature.SignerCertificate.Subject)', not CN=FastADC" }
          Write-Host "$($msix.Name): signature Valid, CN=FastADC, $($cer.Thumbprint)"

      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "release-files"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $msix = Get-ChildItem ui/AppPackages -Recurse -Filter "Synka_$($env:VERSION).0_x64.msix" | Select-Object -First 1
          $zip = Get-Item "dist/Synka-$($env:VERSION)-sidladdning.zip"
          Copy-Item $msix.FullName, $zip.FullName, packaging/FastADC.cer -Destination $out
          $rows = @(Get-ChildItem $out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "| ``$($_.Name)`` | $([math]::Round($_.Length / 1MB, 1)) MB | ``$hash`` |"
          })
          if ($rows.Count -ne 3) { throw "Expected 3 release files in $out, found $($rows.Count)" }
          $summary = @("### Synka $($env:VERSION)", "", "| File | Size | SHA-256 |", "|---|---|---|") + $rows
          $summary | Write-Host
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove the signing key
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "synka-signing.pfx") -Force -ErrorAction SilentlyContinue

  publish:
    name: Publish
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the release on this repository
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          # The previous tag and the commits since it, for the notes.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Write the release notes
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # The annotated tag itself, so its message is at hand whatever checkout did.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"

          # What is new: 1. the notes typed into Run workflow; 2. the body of the
          # annotated tag (new_release.ps1 -Notes, or git tag -a by hand); 3. the
          # commits since the previous release tag.
          whatsnew="${NOTES_INPUT:-}"
          if [ -z "${whatsnew//[[:space:]]/}" ] && [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            whatsnew="$(git for-each-ref --format='%(contents:body)' "refs/tags/$TAG")"
          fi
          if [ -z "${whatsnew//[[:space:]]/}" ]; then
            previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then range="$previous..$TAG"; else range="$TAG"; fi
            whatsnew="$(git log --no-merges --format='- %s' "$range" | grep -v -E '^- chore: version [0-9]' || true)"
            [ -n "$whatsnew" ] || whatsnew="- Inga ändringar utöver versionsnumret."
            if [ -n "$previous" ]; then
              whatsnew="$whatsnew"$'\n\n'"Commits sedan $previous."
            fi
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '## Nyheter\n\n%s\n\n' "$whatsnew"
            sed "s/@VERSION@/$VERSION/g" <<'EOF'
          ## Installera

          Ladda ner `Synka-@VERSION@-sidladdning.zip`, packa upp HELA zip-filen och dubbelklicka på `Install.cmd`. Windows frågar efter administratörsrätt en gång per dator, för certifikatet. Synka söker inte efter uppdateringar själv: en ny version installeras på samma sätt. Har datorn appen under ett äldre paketnamn tar Install.cmd bort det först (se README.txt).

          Krav: Windows 10 version 2004 (build 19041) eller senare, x64.

          | Fil | Vad |
          |---|---|
          | `Synka-@VERSION@-sidladdning.zip` | Allt för en ny installation: appen, ramverket (Windows App SDK), certifikatet och `Install.cmd` |
          | `Synka_@VERSION@.0_x64.msix` | Det signerade paketet, samma som appens egen uppdatering installerar |
          | `FastADC.cer` | Certifikatet (`CN=FastADC`) som paketet är signerat med |

          ## Varumärken / Trademarks

          Autodesk, Autodesk Construction Cloud, Autodesk Docs, Autodesk Forma och Revit är registrerade varumärken eller varumärken som tillhör Autodesk, Inc. och/eller dess dotter- eller närstående bolag. Synka är en fristående produkt från Byggstyrning och är inte ansluten till, godkänd av eller sponsrad av Autodesk.

          Autodesk, Autodesk Construction Cloud, Autodesk Docs, Autodesk Forma and Revit are registered trademarks or trademarks of Autodesk, Inc., and/or its subsidiaries and/or affiliates. Synka is an independent product of Byggstyrning and is not affiliated with, endorsed by or sponsored by Autodesk.
          EOF
          } > "$notes"

          cat "$notes"

      - name: Publish on this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "release-files/Synka-$VERSION-sidladdning.zip"
            "release-files/Synka_$VERSION.0_x64.msix"
            "release-files/FastADC.cer"
          )
          for asset in "${assets[@]}"; do
            [ -f "$asset" ] || { echo "::error::$asset is missing from the build's files"; exit 1; }
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run after a later step failed: same tag, same files, replaced.
            echo "$TAG exists on $GITHUB_REPOSITORY; replacing its files and notes."
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Synka $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Synka $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "Published: $url"
          echo "Published [$TAG]($url) on $GITHUB_REPOSITORY." >> "$GITHUB_STEP_SUMMARY"
